name: CloudSentinel AI CI/CD & AWS Stack Validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate-and-test:
    name: Validate IaC & Run Serverless Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Validate CloudFormation Stack Template
        run: |
          echo "Validating CloudFormation template syntax..."
          python -c "import yaml; yaml.safe_load(open('infrastructure/cloudformation-template.yaml'))"

      - name: Run Backend Unit & Integration Tests
        env:
          AWS_ACCOUNT_ID: '145023097151'
          LEAD_ARCHITECT: 'Aaditya Uniyal'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py"

      - name: Install Frontend Dependencies & Build Production Bundle
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
